[package]
name = "cdscf"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "统计 GenBank 和 SnapGene 文件编码区的密码子频率"
readme = "README.md"
license = "MIT"

[features]
default = []
gui = ["dep:eframe", "dep:image", "dep:rfd"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
roxmltree = "0.20"
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rfd = { version = "0.15", optional = true }

[build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "cdscf"
path = "src/main.rs"

[[bin]]
name = "cdscf-gui"
path = "src/gui.rs"
required-features = ["gui"]

[profile.release]
lto = true
codegen-units = 1
strip = true
